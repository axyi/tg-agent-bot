version: "2026-09-03.1"

scope:
  base_branch: main
  zero_sha: "0000000000000000000000000000000000000000"

profiles:
  pre-commit: [ruff-check, ruff-format, ruff-format-all, gitleaks-staged, branch-name]
  pre-push:   [ruff-check-all, ruff-format-all, branch-name, pytest, selftest,
               gitleaks-tree, trivy, semgrep, skylos, mutation-v15, mutation-v160,
               mutation-v170, mutation-v180, mutation-v190, hooks-installed, doctor]
  full:       [uv-sync, ruff-check-all, ruff-format-all, branch-name, pytest,
               selftest, selftest-live, rag-eval, mutation-all, gitleaks-tree,
               trivy, semgrep, skylos, hooks-installed, doctor, lint-docs]

# T1 writes each pin at its currently-installed version (REQ-V15-DEP-04);
# trivy and skylos are not installed yet and stay absent from this block
# until T4/T5 -- doctor iterates only what's here.
tools:
  ruff:     { version: "0.16.6", via: uv, version_parser: last_token,
              version_argv: [uv, run, --locked, ruff, --version] }
  gitleaks: { version: "8.30.1", via: binary, version_parser: bare,
              version_argv: [gitleaks, version] }
  semgrep:  { version: "1.176.0", via: uv-tool, version_parser: bare,
              version_argv: [semgrep, --version] }
  rtk:      { version: "0.47.0", via: binary, version_parser: last_token,
              version_argv: [rtk, --version] }
  trivy:    { version: "0.74.0", via: binary, version_parser: last_token,
              version_argv: [trivy, --version] }
  skylos:   { version: "4.35.0", via: uv-tool, version_parser: last_token,
              version_argv: [skylos, --version] }

gates:
  ruff-check:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, ruff, check, --force-exclude, "{target}"]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: true
    timeout_seconds: 30

  ruff-check-all:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, ruff, check, "."]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 30

  # v1.9.2 T1 (REQ-V15-NG-04, closed): spec-v1.5's own note (spec-v1.5.md:
  # 929-951) parked the whole-tree reformat as known debt, blocking only
  # `blocking_paths` (this fast pre-commit check) while every other file
  # stayed shadow. That debt is paid off in this release's own commit
  # (mutation_check.py's re-derived find strings, gate 6 at 0 drifted, every
  # `*.py` in the tree already formatted) -- `ruff-format-all` below is the
  # whole-tree twin, the same shape as `ruff-check-all` next to
  # `ruff-check`. `pre-commit` now runs both this gate and `ruff-format-all`
  # (v1.9.2 T1 review, prompt 166): the tree-formatted world alone doesn't
  # retire this one, because `devtools/checks.py:892`'s `replay` reads this
  # gate's own `blocking_paths` to re-verify commits made *before* the
  # whole-tree reformat existed, when the new/legacy split was still real --
  # deleting the key would break replaying that history. `pre-push`/`full`
  # keep only `ruff-format-all`, since a push/full run never needs to
  # replay a single historical commit through the partitioned shape.
  ruff-format:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, ruff, format, --check, --force-exclude, "{target}"]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: true
    blocking_paths: [devtools/checks.py, devtools/install_hooks.py,
                      tests/test_v15_standards.py]
    timeout_seconds: 30

  # devtools/bench_scenarios.py is excluded here too (pyproject.toml's
  # [tool.ruff.format] exclude, REQ-V13-BEN-12) -- ruff format --check
  # already honours that exclusion with no argv change needed.
  ruff-format-all:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, ruff, format, --check, "."]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 30

  branch-name:
    kind: builtin
    handler: branch_name
    pattern: "^(main|(feat|fix|docs|test|chore)/[a-z0-9][a-z0-9._-]*)$"
    warn_refs: [main]
    warn_on_detached: true
    blocking: true
    diff_scoped: false
    timeout_seconds: 5

  gitleaks-staged:
    kind: command
    result_mode: findings
    argv: [gitleaks, git, --staged, --no-banner, --redact, --config, "{config}",
           --report-format, json, --report-path, "{artefact}", "."]
    placeholders: { config: .gitleaks.toml }
    output_format: json
    parser: gitleaks_json
    success_exit_codes: [0]
    findings_exit_codes: [1]
    artefact: .bench/checks/{profile}/gitleaks-staged.json
    blocking: true
    diff_scoped: false
    severity: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
    timeout_seconds: 60

  gitleaks-tree:
    kind: command
    result_mode: findings
    argv: [gitleaks, dir, --no-banner, --redact, --config, "{config}",
           --report-format, json, --report-path, "{artefact}", "{tracked_tree}"]
    placeholders: { config: .gitleaks.toml }
    output_format: json
    parser: gitleaks_json
    success_exit_codes: [0]
    findings_exit_codes: [1]
    artefact: .bench/checks/{profile}/gitleaks-tree.json
    blocking: true
    diff_scoped: false
    severity: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
    timeout_seconds: 120

  uv-sync:
    kind: command
    result_mode: exit_status
    argv: [uv, sync, --locked]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 60

  pytest:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, pytest]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 120

  selftest:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, bot.py, --selftest]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 30

  selftest-live:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, bot.py, --selftest-live]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 60

  # spec-v1.9.0 T8 (REQ-V190-EVAL-04): gate 7, the retrieval evaluation --
  # the live environment, same shape as selftest-live, but slower (real
  # embeddings + rerank calls per question) hence the wider timeout.
  #
  # v1.9.0's 600s here predated any real measurement: the rerank stage alone
  # could need ~1970s under the unfixed contract (ten answerable items x the
  # production model's 196.9s measured median), which is why gate 7 was
  # structurally unable to finish, not merely flaky. v1.9.1 T1
  # (docs/reports/report-v1.9.1.md) fixed the contract (a response_format
  # JSON schema, LLM_RERANK_MODEL routed to a fast non-thinking model) and
  # re-measured one real green run: `time uv run --locked python
  # devtools/rag_eval.py`, this tree, 2026-09-12: real=4m47.388s (~287.4s)
  # -> 2x ~574.8s, rounded up to 580s, following the same rule the
  # mutation-* gates below already use.
  rag-eval:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, devtools/rag_eval.py]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 580

  # Confirmed against trivy fs --help at 0.74.0 (T4): --scanners, --severity,
  # --exit-code, --ignore-unfixed, --format json, --output all unchanged.
  trivy:
    kind: command
    result_mode: findings
    argv: [trivy, fs, --scanners, "vuln,misconfig", --severity, "HIGH,CRITICAL",
           --exit-code, "1", --ignore-unfixed, --format, json, --output,
           "{artefact}", "{target}"]
    placeholders: { target: "." }
    output_format: json
    parser: trivy_json
    success_exit_codes: [0]
    findings_exit_codes: [1]
    artefact: .bench/checks/{profile}/trivy.json
    blocking: true
    diff_scoped: true
    severity: [CRITICAL, HIGH]
    timeout_seconds: 240

  # v1.9.2 T1: --exclude .semgrep excludes the rule pack's own vendored
  # ruleset from the scan target -- without it, semgrep scans
  # .semgrep/p-security-audit.yaml as if it were project source and finds
  # its own example vulnerable snippets (2 x INFO, below --severity ERROR,
  # so never blocking, but noise on an unfiltered run).
  semgrep:
    kind: command
    result_mode: findings
    argv: [semgrep, scan, --config, "{config}", --exclude, ".semgrep",
           --severity, ERROR, --error,
           --metrics=off, --disable-version-check, --json, --output,
           "{artefact}", "{target}"]
    placeholders: { config: .semgrep/, target: "." }
    output_format: json
    parser: semgrep_json
    success_exit_codes: [0]
    findings_exit_codes: [1]
    artefact: .bench/checks/{profile}/semgrep.json
    blocking: true
    diff_scoped: true
    severity: [ERROR]
    timeout_seconds: 180

  # Confirmed against skylos --help at 4.35.0 (T5): bare mode always exits 0
  # regardless of findings, so --gate --strict is added for exit-code
  # semantics ("0 if clean" / "1 if any finding") consistent with every
  # other findings gate; measured empirically on this repository.
  skylos:
    kind: command
    result_mode: findings
    argv: [skylos, "{target}", --gate, --strict, --format, json, --output,
           "{artefact}"]
    placeholders: { target: "." }
    output_format: json
    parser: skylos_json
    success_exit_codes: [0]
    findings_exit_codes: [1]
    artefact: .bench/checks/{profile}/skylos.json
    blocking: false
    diff_scoped: true
    severity: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]
    timeout_seconds: 120

  # D2 (v1.5.1): timeout_seconds for every mutation-* gate follows one rule
  # -- timeout = 2x a measured direct run -- so a spurious timeout never
  # blocks push/full for load, not correctness. Re-measure and re-apply this
  # same rule whenever a gate's entry count or the suite's own size grows
  # materially; each gate below is measured and dated independently.
  #
  # mutation-v15: measured 2026-09-04 (`time uv run --locked python
  # devtools/mutation_check.py --select v15-`, this tree, 4/4 killed):
  # real=1m39.497s (~100s) -> 2x ~200s, rounded up to 220s.
  mutation-v15:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, devtools/mutation_check.py, --select, "v15-"]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 220

  # spec-v1.6.0 T13/T14 (REQ-V160-GATE-02): the eleven v160-* entries of
  # section 15.4 (T13 landed ten; T14's review restored the spec's own
  # v160-content-redact-bypassed at its named target, an eleventh, once a
  # test existed to kill it there -- see docs/reports/report-v1.6.0.md).
  # T13's own 10-entry measurement (2026-09-05, 550.338s) is superseded by
  # the orchestrator's fresh 11-entry measurement below, taken after T14
  # landed, per the same 2x-measured-run rule as mutation-v15/mutation-all.
  #
  # Orchestrator measured directly on 2026-09-05 (`time uv run --locked
  # python devtools/mutation_check.py --select v160-`, this tree, 11/11
  # killed): real=9m52.985s (592.985s) -> 2x ~1185.97s, rounded up to
  # 1190s. (~54s/entry, consistent with T13's own rate -- every v160-*
  # killer test lives in test_v160_*.py, which sorts last, so under
  # `pytest -x` each kill runs nearly the whole suite before the first
  # failure lands.)
  mutation-v160:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, devtools/mutation_check.py, --select, "v160-"]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 1190

  # spec-v1.7.0 T9 (REQ-V170-GATE-02): the nine v170-* entries of section
  # 14.4. Measured directly 2026-09-07 (`time uv run --locked python
  # devtools/mutation_check.py --select v170-`, this tree, 9/9 killed):
  # real=8m53.680s (533.680s) -> 2x ~1067.36s, rounded up to 1070s.
  mutation-v170:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, devtools/mutation_check.py, --select, "v170-"]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 1070

  # spec-v1.8.0 T6 (REQ-V180-EC-10): the six v180-* entries of task-brief
  # v180-T6 (three chat-status/typing mechanisms already landed at T2/T3,
  # three transcript redaction/truncation/budget mechanisms of this task).
  # Measured directly 2026-09-09 (`time uv run --locked python
  # devtools/mutation_check.py --select v180-`, this tree, 6/6 killed):
  # real=6m42.000s (402s) -> 2x 804s, rounded up to 810s.
  mutation-v180:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, devtools/mutation_check.py, --select, "v180-"]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 810

  # spec-v1.9.0 T9 (REQ-V190-EC-10): the seven v190-* entries of task-brief
  # v190-T9 (RAG-over-documents isolation SEC-01..03, the delete path's
  # vector cleanup STO-03, the upload size precheck CMD-02, the
  # sources-fallback rendering TOOL-06). Measured directly 2026-09-11
  # (`time uv run --locked python devtools/mutation_check.py --select
  # v190-`, this tree, 7/7 killed): real=8m29.464s (509.464s) -> 2x
  # ~1018.928s, rounded up to 1020s.
  mutation-v190:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, devtools/mutation_check.py, --select, "v190-"]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 1020

  # mutation-all: T13 measured 1908.041s at 82 entries (2026-09-05); T14
  # added an eleventh v160-* entry (83 total). Orchestrator re-measured
  # directly on 2026-09-05 (`time uv run --locked python
  # devtools/mutation_check.py`, no --select, this tree, 83/83 killed):
  # real=41m59.234s (2519.234s) -> 2x ~5038.468s, rounded up to 5040s. Up
  # from 3820s (82 entries, 1908.041s): the jump is larger than one more
  # ~55s entry would predict (1908 + 55 = 1963s), consistent with this
  # being a shared, contended machine (documented earlier in this run's
  # report as a recurring source of slow/varying wall-clock measurements)
  # rather than a change in the mutation set itself -- the 2x safety
  # margin exists precisely to absorb this kind of run-to-run variance, so
  # the fresh measurement is used as-is rather than adjusted.
  #
  # spec-v1.7.0 T9: nine v170-* entries added (92 total). Re-measured
  # directly 2026-09-07 (`time uv run --locked python
  # devtools/mutation_check.py`, no --select, this tree, 92/92 killed):
  # real=39m3.796s (2343.796s) -> 2x ~4687.592s, rounded up to 4690s. Down
  # from 5040s at 83 entries despite nine more entries and a larger suite
  # per rerun -- consistent with the same shared-machine variance noted
  # above (this run happened to land on a quieter stretch); used as
  # measured, per the same rationale.
  #
  # spec-v1.8.0 T6: six v180-* entries added (98 total). Re-measured
  # directly 2026-09-09 (`time uv run --locked python
  # devtools/mutation_check.py`, no --select, this tree, 98/98 killed):
  # real=46m49.000s (2809s) -> 2x 5618s, rounded up to 5620s. Up from 4690s
  # at 92 entries -- six more entries plus a larger pytest suite per rerun
  # (1217 tests vs. 1133 at T9's close) account for some of the jump, but
  # not all of it; consistent with this being a shared, contended machine
  # (documented at both earlier re-measurements above), so the fresh number
  # is used as measured rather than adjusted toward a naive extrapolation.
  #
  # spec-v1.9.0 T9: seven v190-* entries added (105 total). Re-measured
  # directly 2026-09-11 (`time uv run --locked python
  # devtools/mutation_check.py`, no --select, this tree, 105/105 killed):
  # real=60m58.865s (3658.865s) -> 2x ~7317.73s, rounded up to 7320s. Up
  # from 5620s at 98 entries -- seven more entries plus a larger pytest
  # suite per rerun (1537 tests collected vs. 1217 at T6's close) account
  # for the jump; consistent with the same shared, contended machine noted
  # at every earlier re-measurement above, so the fresh number is used as
  # measured rather than adjusted toward a naive extrapolation. The T9
  # subagent's session was interrupted by an infra rate limit right after
  # this measurement; the orchestrator resumed the task directly and
  # re-measured before committing (2026-09-11, same tree, 105/105 killed):
  # real=65m53.309s (3953.309s) -> 2x ~7906.6s, rounded up to 7910s -- the
  # higher of the two same-day measurements is used, per the same
  # shared-machine-variance rationale as every entry above (the 2x margin
  # exists to absorb exactly this run-to-run spread).
  mutation-all:
    kind: command
    result_mode: exit_status
    argv: [uv, run, --locked, python, devtools/mutation_check.py]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 7910

  hooks-installed:
    kind: command
    result_mode: exit_status
    argv: [python3, devtools/install_hooks.py, --check]
    placeholders: {}
    success_exit_codes: [0]
    blocking: true
    diff_scoped: false
    timeout_seconds: 10

  doctor:
    kind: builtin
    handler: doctor
    warn_only_tools: [rtk]
    blocking: true
    diff_scoped: false
    timeout_seconds: 30

  lint-docs:
    kind: builtin
    handler: lint_docs
    prompt_glob: "docs/prompts/[0-9][0-9]*.md"
    exempt_files: [01-go-spec-v0.md, 02-code-review.md, 03-go-spec-v1.md,
                   04-code-review-v1.md, 05-go-spec-v1.1.md,
                   06-code-review-v1.1.md, 07-go-spec-v1.2.md,
                   08-code-review-v1.2.md, 09-go-spec-v1.3.md,
                   10-v13-TA1-carryover.md, 11-v13-TA2-observability.md,
                   12-v13-TA3-pricing.md, 13-v13-TA4-bench.md,
                   14-v13-TA5-dashboard.md, 15-v13-TA6-mutations.md,
                   16-v13-TA7-review-stage-a.md, 17-v13-TA8-review-fixes.md,
                   18-v13-TB1-audit.md, 19-v13-TC1-tool-output.md,
                   20-v13-TC2-history-stub.md, 21-v13-TC3-prefix.md,
                   22-v13-TC4-reasoning.md, 23-v13-TC5-routing.md,
                   24-v13-TC6-mutations.md, 25-v13-TC7-review-stage-c.md,
                   26-v13-TC8-review-fixes.md, 27-v13-TC9-docs.md,
                   28-v13-TD1-report.md, 29-v13-TD2-tg-post.md,
                   30-v13-verify-run-fixes.md, 31-go-spec-v1.4.md,
                   32-v14-t0-preconditions.md, 33-v14-t1-s01-root-cause.md,
                   34-v14-t2-harness-readiness.md, 35-v14-t3-baseline-v14.md,
                   36-v14-t4-rsn-spike.md, 37-v14-t6-reliability.md,
                   38-v14-t8-default-selection.md, 39-v14-t9-mutations.md,
                   40-v14-t9-review.md, 41-v14-t10-report.md,
                   42-v14-t10-advisor-followup.md, 43-v14-verify-run-fixes.md]
    report_path: docs/reports/report-v1.9.1.md
    ledger_header: "| Project | Ver | Date | Spec (tokens) | Prompts | First run | Bugs | Tokens ↑/↓ | Cost | Model | Harness |"
    blocking: true
    diff_scoped: false
    timeout_seconds: 15
