[project]
name = "tg-agent-bot"
version = "1.9.3"
description = "Telegram bot turned into a bounded LLM agent"
requires-python = ">=3.13,<3.15"
dependencies = [
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "sqlite-vec==0.1.9",
    "pypdf==6.18.0",
    "python-docx==1.2.0",
    "rank-bm25==0.2.2",
    "snowballstemmer==3.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "RUF100",
    # v1.9.3 T3 commit A (REQ-V15-NG-04 continuation): the ruff autofix
    # tier -- mechanical, behaviour-preserving rewrites only, added
    # rule-level (never family-level, so no never-listed sibling rule
    # rides along). See docs/reports/report-v1.9.3.md's "T3" section.
    "UP037", "UP017", "UP031", "C420", "C408", "SIM300", "SIM102",
    "RET501", "RET503", "RET504", "FURB105", "FURB110", "FURB167",
    "FURB187", "FURB192", "PIE810", "RUF015", "RUF059", "PLW0108",
    # v1.9.3 T3 commit B: the bug-class tier.
    "PLW1510", "TRY400", "ISC004", "RUF005", "RUF007", "PERF401",
    "SIM105", "SIM117", "TRY004", "PLW2901",
]

# v1.9.3 T3: the ruff rule-family proposal table (docs/reports/report-v1.9.2.md),
# decided and closed. One line per family never adopted -- the reason is
# the decision; see docs/spec/task-briefs/v193-T3.md and
# docs/reports/report-v1.9.3.md's "T3" section for the full rationale.
# never -- `assert` is pytest's contract; a per-file-ignore for tests/
# would still leave S105/S106 (false positives on names like
# LLM_RERANK_MODEL) and S603/S607 (intentional subprocess sites): S101
# never -- magic-value noise: PLR2004
# never -- vanilla-args style, no defect class: TRY003
# never -- protocol/callback signatures (skylos already audits unused
# params with per-site reasons): ARG001, ARG002, ARG005
# never -- refactor policy, not a defect: PLR09xx (complexity), PLR0913, PLR0917
# never -- devtools/ CLIs print by design: T20
# never -- renaming public exception classes is an API change: N818
# never -- the bot's "never crash the loop" policy; each site logs: BLE001
# never -- lazy imports by design (start-up cost, optional deps): PLC0415
# never -- Cyrillic in user-facing strings: RUF001, RUF002, RUF003
# not now -- os.chmod/os.stat in storage.py are deliberate mode-bit code;
# pathlib rewrite is a v1.10 style task: PTH*
# not now -- module-level state pattern (_shutdown, _started_at,
# _dropped_spans): PLW0603
# not now -- one pytest.raises(match=) pattern; fix when that test is
# next touched: RUF043

# v1.9.3 T3 commit B: devtools/bench_scenarios.py is excluded from ruff
# format for a byte-hash reason (see [tool.ruff.format] below,
# REQ-V13-BEN-12) -- the same reason generalises to these two lint rules,
# whose only fix here would rewrite this file's bytes and invalidate every
# committed docs/assets/bench/*.json artefact's pinned scenarios_sha256().
# The brief named this exclusion for PERF401/SIM117 (neither of which
# actually hits this file); TRY004 (1 hit) and ISC004 (11 hits) do, so the
# same exclusion applies to them instead. See docs/reports/report-v1.9.3.md.
[tool.ruff.lint.per-file-ignores]
"devtools/bench_scenarios.py" = ["TRY004", "ISC004"]

# v1.9.2 T1 (REQ-V15-NG-04): `docs/` was already out of scope for
# formatting at spec-v1.5 (spec-v1.5.md:951 -- "ruff format also reaches
# into fenced blocks in docs/spec/*.md, so the shadow report is scoped to
# *.py and docs/ is excluded outright"), enforced until now by the runner
# filtering scope to *.py before invoking ruff. `ruff-format-all` (the new
# whole-tree gate, config/quality_gates.yaml) passes ruff a literal "."
# with no runner-side filtering, so that pre-existing policy is formalised
# here instead -- not a new exception, the same one spec-v1.5 named.
#
# devtools/bench_scenarios.py IS a new exception (REQ-V13-BEN-12):
# devtools/bench.py:335-340's scenarios_sha256() hashes this file's raw
# bytes, and that hash is pinned inside every committed
# docs/assets/bench/*.json benchmark artefact -- a frozen measurement
# record, never edited to match new bytes. Reformatting the file would
# silently invalidate all of them. Lint (ruff check) still covers both
# exclusions below; only the formatter skips them.
[tool.ruff.format]
exclude = ["docs/**", "devtools/bench_scenarios.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# v1.9.2 T2 section 3.3: pytest-xdist plateaus at -n 8 on this suite (the
# critical path is the semgrep test plus the exec-tool timeouts, which
# don't parallelise further); gate 6's mutation runner opts out explicitly
# (devtools/mutation_check.py:default_runner passes -n 0 -- xdist worker
# start-up cost would dominate its smallest, sub-3s kills).
addopts = "-q -n auto"
