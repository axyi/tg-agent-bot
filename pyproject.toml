[project]
name = "tg-agent-bot"
version = "1.9.1"
description = "Telegram bot turned into a bounded LLM agent"
requires-python = ">=3.13,<3.15"
dependencies = [
    "httpx==0.28.1",
    "python-dotenv==1.2.3",
    "sqlite-vec==0.1.9",
    "pypdf==6.18.0",
    "python-docx==1.2.0",
    "rank-bm25==0.2.2",
    "snowballstemmer==3.1.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "RUF100"]

# v1.9.2 T1 (REQ-V15-NG-04): `docs/` was already out of scope for
# formatting at spec-v1.5 (spec-v1.5.md:951 -- "ruff format also reaches
# into fenced blocks in docs/spec/*.md, so the shadow report is scoped to
# *.py and docs/ is excluded outright"), enforced until now by the runner
# filtering scope to *.py before invoking ruff. `ruff-format-all` (the new
# whole-tree gate, config/quality_gates.yaml) passes ruff a literal "."
# with no runner-side filtering, so that pre-existing policy is formalised
# here instead -- not a new exception, the same one spec-v1.5 named.
#
# devtools/bench_scenarios.py IS a new exception (REQ-V13-BEN-12):
# devtools/bench.py:335-340's scenarios_sha256() hashes this file's raw
# bytes, and that hash is pinned inside every committed
# docs/assets/bench/*.json benchmark artefact -- a frozen measurement
# record, never edited to match new bytes. Reformatting the file would
# silently invalidate all of them. Lint (ruff check) still covers both
# exclusions below; only the formatter skips them.
[tool.ruff.format]
exclude = ["docs/**", "devtools/bench_scenarios.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# v1.9.2 T2 section 3.3: pytest-xdist plateaus at -n 8 on this suite (the
# critical path is the semgrep test plus the exec-tool timeouts, which
# don't parallelise further); gate 6's mutation runner opts out explicitly
# (devtools/mutation_check.py:default_runner passes -n 0 -- xdist worker
# start-up cost would dominate its smallest, sub-3s kills).
addopts = "-q -n auto"
